# SwiftLint configuration (Docs/solid/rewrite-foundations.md section 12.5 step 6; clean-code and interface-segregation checks).
#
# Only the rules below run. Rules that fail the build carry an `error` threshold; the size rules are warnings only because
# `python3 scripts/size-report.py` owns the size thresholds and their review register (Docs/solid/size-review.md).
# Existing violations are not fixed here: CI runs `swiftlint lint --baseline scripts/swiftlint-baseline.json`, a file that
# the first CI run writes (`swiftlint lint --write-baseline scripts/swiftlint-baseline.json`) because SwiftLint is not
# installed on the machine that wrote this file. After that, only new violations fail.

included:
  - Sources
  - App
  - Tests

excluded:
  - Sources/GraphiteUI/Resources
  - Tests/test_vault
  - Tests/BaseSampleVault
  - Tests/CommunityPluginRuntimeTests/node_modules
  - Vendor
  - .build
  - DerivedData

only_rules:
  - function_parameter_count
  - line_length
  - function_body_length
  - type_body_length
  - file_length
  - force_try
  - identifier_name

# ISP 15: a function takes at most 6 parameters (a seventh is a missing value type).
function_parameter_count:
  warning: 6
  error: 6

# CC 17: no new line over 160 characters (scripts/check-rules.py counts the same lines).
line_length:
  warning: 160
  error: 160
  ignores_urls: true
  ignores_comments: false
  ignores_interpolated_strings: false

# Size thresholds of scripts/size-report.py, as warnings only (they never fail the build).
function_body_length:
  warning: 40
  error: 100000
type_body_length:
  warning: 300
  error: 100000
file_length:
  warning: 400
  error: 100000
  ignore_comment_only_lines: true

# CC 29: no `try!` in production or tests.
force_try: error

# RULES.md: full descriptive names; no single-letter names such as i, j, e, p, w, h.
identifier_name:
  min_length:
    warning: 2
    error: 2
  max_length:
    warning: 80
    error: 200
  validates_start_with_lowercase: error
  allowed_symbols: ["_"]
